# OpenShell gateway for ORVYN (private; pinned 0.1.2). Mounted read-only at
# /etc/openshell/gateway.toml by infrastructure/ovh/compose.openshell.yml.
#
# Only the worker (and admin diagnostics through it) talks to this gateway,
# over mTLS. Customer browsers never reach it: it listens on the Docker
# bridge address only, and the port is never published on a public interface.
[openshell]
version = 2

[openshell.gateway]
# 0.0.0.0 inside the container; compose publishes it on the bridge IP only.
bind_address        = "0.0.0.0:8080"
health_bind_address = "127.0.0.1:8081"
log_level           = "info"
compute_driver      = "docker"

[openshell.drivers.docker]
default_image         = "orvyn/sandbox:0.1.2-2"
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox@sha256:bf4797b6c511f2d8ba02955dbba4bf76c1f0dd6d83531420c5408d5f1fb9d72f"
supervisor_image      = "ghcr.io/nvidia/openshell/supervisor@sha256:d7b5264bb6bc56f4796e6fa3617b8e4a8d785be0b7293542efd8cc250b0fb67a"
image_pull_policy     = "if_not_present"
sandbox_label         = "openshell"
# Sandboxes call back through the host bridge. https: mTLS is on.
grpc_endpoint         = "https://host.openshell.internal:8080"
sandbox_pids_limit    = 1024
# ORVYN mounts exactly one workspace per sandbox through a Docker volume that
# is a bind of that run's directory and is labeled for exactly one OpenShell
# workspace (= one ORVYN organization). Admission stays ON, so a volume can
# only ever be attached inside the organization it was labeled for.
allow_driver_config   = true
enable_bind_mounts    = true
# The OVH host has AppArmor. Acceptance proves the Docker runtime profile can
# support the supervisor before this configuration is allowed to go live.
app_armor_profile     = "RuntimeDefault"

[openshell.drivers.docker.resource_admission]
enabled = true

[openshell.drivers.docker.resource_admission.required_labels]
"openshell.ai/sandbox-attachable" = "true"
"openshell.ai/sandbox-attachable-workspace" = "${workspace}"
