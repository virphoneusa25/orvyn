id: orvyn-netlify
display_name: Netlify (ORVYN)
description: Organization-scoped Netlify deployment token
category: deployment
credentials:
  - name: api_token
    description: Netlify token brokered by ORVYN
    env_vars: [NETLIFY_AUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  - host: api.netlify.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/node, /usr/bin/curl]
