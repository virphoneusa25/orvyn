# Left rail — Home, Workspace, Trash. Matches the ORVYN desktop mockup.

rounded = 0
border_width = 0
background_color = #000000 0
border_color = #000000 0
disable_transparency = 1

panel_items = EEE
panel_size = 92 210
panel_margin = 8 0
panel_padding = 4 4 4
panel_background_id = 0
panel_position = left center vertical
panel_layer = top
panel_monitor = all
panel_dock = 0
strut_policy = none
autohide = 0
panel_shrink = 0

execp = new
execp_command = echo Home
execp_has_icon = 0
execp_centered = 1
execp_font = DejaVu Sans 8
execp_font_color = #e8eef8 100
execp_padding = 2 6 2
execp_background_id = 0
execp_lclick_command = thunar /home/orvyn
execp_tooltip = Home

execp = new
execp_command = echo Workspace
execp_has_icon = 0
execp_centered = 1
execp_font = DejaVu Sans 8
execp_font_color = #e8eef8 100
execp_padding = 2 6 2
execp_background_id = 0
execp_lclick_command = thunar /workspace
execp_tooltip = Workspace

execp = new
execp_command = echo Trash
execp_has_icon = 0
execp_centered = 1
execp_font = DejaVu Sans 8
execp_font_color = #e8eef8 100
execp_padding = 2 6 2
execp_background_id = 0
execp_lclick_command = thunar /home/orvyn/.local/share/Trash/files
execp_tooltip = Trash
