# Left rail — Home, Workspace, Trash. Matches the ORVYN desktop mockup.

rounded = 14
border_width = 0
background_color = #0b1224 55
border_color = #1e3a8a 40

panel_items = EEE
panel_size = 88 248
panel_margin = 10 0
panel_padding = 6 8 6
panel_background_id = 1
panel_position = left center vertical
panel_layer = top
panel_monitor = all
panel_dock = 0
strut_policy = none
autohide = 0
panel_shrink = 0

execp = new
execp_command = echo Home
execp_icon = /usr/share/orvyn/icons/home.png
execp_has_icon = 1
execp_cache_icon = 1
execp_icon_w = 26
execp_icon_h = 26
execp_centered = 1
execp_font = DejaVu Sans 8
execp_font_color = #e8eef8 100
execp_padding = 2 6 2
execp_background_id = 0
execp_lclick_command = thunar /home/orvyn
execp_tooltip = Home

execp = new
execp_command = echo Workspace
execp_icon = /usr/share/orvyn/icons/folder.png
execp_has_icon = 1
execp_cache_icon = 1
execp_icon_w = 26
execp_icon_h = 26
execp_centered = 1
execp_font = DejaVu Sans 8
execp_font_color = #e8eef8 100
execp_padding = 2 6 2
execp_background_id = 0
execp_lclick_command = thunar /workspace
execp_tooltip = Workspace

execp = new
execp_command = echo Trash
execp_icon = /usr/share/orvyn/icons/trash.png
execp_has_icon = 1
execp_cache_icon = 1
execp_icon_w = 26
execp_icon_h = 26
execp_centered = 1
execp_font = DejaVu Sans 8
execp_font_color = #e8eef8 100
execp_padding = 2 6 2
execp_background_id = 0
execp_lclick_command = thunar /home/orvyn/.local/share/Trash/files
execp_tooltip = Trash
