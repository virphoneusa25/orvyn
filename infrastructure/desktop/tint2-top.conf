# tint2 top panel — ORVYN desktop. GNOME-like bar:
#   [Activities] [Files]  <space> [clock] <space> [systray] [wifi] [vol] [power]
# Indicator icons are shipped PNGs (/usr/share/orvyn/indicators) so the panel
# looks identical regardless of the installed icon theme.

rounded = 0
border_width = 1
background_color = #070d1c 92
border_color = #16224a 60

panel_items = ELFCSFEEE
panel_size = 100% 34
panel_margin = 0 0
panel_padding = 10 0 10
panel_background_id = 1
panel_position = top center horizontal
panel_layer = top
panel_monitor = all
panel_dock = 0
strut_policy = follow_size
disable_transparency = 0
panel_shrink = 0
autohide = 0

# ── "Activities" app menu ─────────────────────────────────────────────────
execp = new
execp_command = echo Activities
execp_interval = 0
execp_font = DejaVu Sans 10 bold
execp_font_color = #e6edf9 100
execp_padding = 6 0 10
execp_background_id = 0
execp_lclick_command = jgmenu_run
execp_tooltip = Applications

# ── Launcher: Files ───────────────────────────────────────────────────────
launcher = new
launcher_icon_theme = Papirus
launcher_icon_size = 20
launcher_padding = 4 2 4
launcher_background_id = 0
launcher_tooltip = 1
launcher_item_app = /usr/share/applications/orvyn-files.desktop

# ── Centered clock ────────────────────────────────────────────────────────
time1_format = %a %b %d  %H:%M
time1_font = DejaVu Sans 10
time1_timezone =
time2_format =
clock_font_color = #dfe7f7 100
clock_padding = 8 0 8
clock_background_id = 0
clock_tooltip = %A, %d %B %Y
clock_lclick_command =
clock_rclick_command =

# ── Taskbar (hidden — dock handles apps; keeps window list minimal) ──────
taskbar_mode = single_desktop
taskbar_padding = 0 0 0
taskbar_background_id = 0
taskbar_name = 0
taskbar_hide_inactive_tasks = 0
taskbar_always_show_all_desktop_tasks = 1
taskbar_sort_order = left_right
task_align = left
task = new
task_icon = 0
task_text = 0
task_maximum_size = 0 0
task_padding = 0 0 0
task_background_id = 0
task_active_background_id = 0

# ── System tray ───────────────────────────────────────────────────────────
systray = 1
systray_padding = 4 0 4
systray_icon_size = 16
systray_sort = right2left
systray_background_id = 0

# wifi indicator
execp = new
execp_command = echo ""
execp_icon = /usr/share/orvyn/indicators/wifi.png
execp_has_icon = 1
execp_cache_icon = 1
execp_icon_w = 18
execp_icon_h = 18
execp_markup = 0
execp_interval = 0
execp_padding = 5 0 5
execp_background_id = 0
execp_tooltip = Network: sandbox

# volume indicator
execp = new
execp_command = echo ""
execp_icon = /usr/share/orvyn/indicators/volume.png
execp_has_icon = 1
execp_cache_icon = 1
execp_icon_w = 18
execp_icon_h = 18
execp_markup = 0
execp_interval = 0
execp_padding = 5 0 5
execp_background_id = 0
execp_tooltip = Volume

# power/session indicator
execp = new
execp_command = echo ""
execp_icon = /usr/share/orvyn/indicators/power.png
execp_has_icon = 1
execp_cache_icon = 1
execp_icon_w = 18
execp_icon_h = 18
execp_markup = 0
execp_interval = 0
execp_padding = 5 0 10
execp_background_id = 0
execp_lclick_command = openbox --exit
execp_tooltip = Session

# ── Backgrounds ───────────────────────────────────────────────────────────
# (defined at top: id 1 = panel bar)
rounded = 8
border_width = 1
background_color = #101c40 95
border_color = #2c3f7e 70
