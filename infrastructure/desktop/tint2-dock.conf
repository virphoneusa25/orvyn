# tint2 bottom dock — centered floating glass pill with app launchers.
#   [terminal] [files] [chromium] [editor] [settings]

rounded = 18
border_width = 1
background_color = #0b1226 78
border_color = #2a3f8e 55

panel_items = L
panel_size = 0 46
panel_margin = 0 10
panel_padding = 10 4 10
panel_background_id = 1
panel_position = bottom center horizontal
panel_layer = top
panel_monitor = all
panel_dock = 0
panel_shrink = 1
strut_policy = off
autohide = 0
disable_transparency = 0

launcher = new
launcher_icon_theme = Papirus
launcher_icon_size = 30
launcher_padding = 8 4 8
launcher_background_id = 0
launcher_tooltip = 1
launcher_item_app = /usr/share/applications/orvyn-terminal.desktop
launcher_item_app = /usr/share/applications/orvyn-files.desktop
launcher_item_app = /usr/share/applications/chromium.desktop
launcher_item_app = /usr/share/applications/orvyn-editor.desktop
launcher_item_app = /usr/share/applications/orvyn-settings.desktop
