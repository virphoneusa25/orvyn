# infrastructure/ovh/compose.prod.yml
# Production overrides for OVH (or any Linux VM). Use together with the
# root compose file:
#
#   docker compose -f docker-compose.yml -f infrastructure/ovh/compose.prod.yml up -d --build
#
# Adds: container healthcheck on the real /health endpoint, log rotation,
# and an explicit restart policy. See docs/OVH_DEPLOYMENT.md.

services:
  backend:
    environment:
      # Production cloud: missing or invalid credentials must not become the
      # local default tenant. Local `npm run backend:dev` leaves this unset.
      - ORVYN_CLOUD_MODE=true
    restart: always
    healthcheck:
      # node:20-slim has no curl; use node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4570/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
