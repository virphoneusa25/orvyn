name: Native desktop boundary
on:
  pull_request:
    paths: ['apps/desktop/native/**', 'apps/desktop/src/main/nativeDesktop*', 'scripts/*native-desktop*', '.github/workflows/native-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-helper:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node scripts/build-native-desktop.mjs
      - run: node scripts/test-native-desktop.mjs
      - run: node --experimental-strip-types --test apps/desktop/src/main/nativeDesktopPolicy.test.ts
