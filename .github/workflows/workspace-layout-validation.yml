name: Cloud workspace and mobile layout validation
on:
  push:
    branches: [publish/mobile-layout-fix, publish/cloud-workbench-mobile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Build backend dependencies used by existing web tests
        run: npm run build -w apps/backend
      - name: Web unit tests, typecheck and production bundle
        run: |
          npm run test -w apps/web
          npm run typecheck -w apps/web
          npm run build -w apps/web
      - name: Build Desktop files required by its existing regression tests
        run: npm run build -w apps/desktop
      - name: Existing backend and desktop regression suite
        run: npm test
      - name: Existing Cloud workspace API tests
        run: |
          if test -f apps/backend/src/routes/cloudWorkbench.test.ts; then
            node --test apps/backend/dist/routes/cloudWorkbench.test.js
          fi
      - run: npx playwright install --with-deps chromium
      - name: Real browser responsive and workspace regression checks
        env:
          ORVYN_RESPONSIVE_SCREENSHOTS: artifacts/responsive
        run: |
          if test -f apps/web/src/components/CloudWorkbench.tsx; then export ORVYN_EXPECT_WORKBENCH=1; fi
          node scripts/acceptance/web-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-responsive-screenshots
          path: artifacts/responsive

  packaged-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Build the actual pinned mission sandbox browser image
        run: docker build -t orvyn-browser-acceptance infrastructure/openshell/sandbox-image
      - name: Exercise the actual worker browser helper against a rendered website
        run: node scripts/acceptance/cloud-browser-helper.mjs
      - name: Build the packaged backend and Cloud portal
        run: docker build -f apps/backend/Dockerfile -t orvyn-backend-acceptance .
      - name: Verify packaged Playwright and Chromium are usable
        run: |
          docker run --rm --entrypoint node orvyn-backend-acceptance -e 'const {chromium}=require("playwright"); (async()=>{const browser=await chromium.launch({args:["--no-sandbox"]}); try {const page=await browser.newPage(); await page.setContent("<title>ORVYN packaged browser</title>"); if(await page.title()!=="ORVYN packaged browser") throw new Error("Browser failed"); console.log("Packaged Chromium passed");} finally {await browser.close();}})().catch(error=>{console.error(error);process.exit(1)})'
