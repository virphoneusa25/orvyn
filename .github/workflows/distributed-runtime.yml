name: Distributed Runtime Validation

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/ai-core/**"
      - "docker-compose.yml"
      - "infrastructure/litellm/**"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Node 22 matches the production backend image and node:sqlite runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The branch introduces new BullMQ/ioredis dependencies. Use npm install
      # until package-lock.json is regenerated by a connected development
      # environment, then this should be tightened back to npm ci.
      - name: Install dependencies
        run: npm install --workspaces --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: regenerate package lock for distributed runtime"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Build ai-core
        run: npm run build -w @orvyn/ai-core

      - name: Build backend
        run: npm run build -w @orvyn/backend

      - name: Queue/runtime tests
        run: node --test apps/backend/dist/queue/*.test.js

      - name: Existing backend tests
        run: npm test

      - name: Prepare Compose env file
        run: cp .env.example .env

      - name: Validate Compose
        env:
          ORVYN_API_KEY: test
          DOMAIN: example.invalid
          ORVYN_REDIS_PASSWORD: test-orvyn-redis
          LITELLM_REDIS_PASSWORD: test-litellm-redis
          LITELLM_MASTER_KEY: sk-test-master
          LITELLM_SALT_KEY: test-salt
        run: docker compose config >/dev/null
