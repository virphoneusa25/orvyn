name: PostgreSQL Mirror Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/postgres-mirror.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orvyn
          POSTGRES_PASSWORD: test-postgres-password
          POSTGRES_DB: orvyn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orvyn -d orvyn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --workspaces --ignore-scripts --no-audit --no-fund

      - name: Build ai-core
        run: npm run build -w @orvyn/ai-core

      - name: Build backend
        run: npm run build -w @orvyn/backend

      - name: PostgreSQL mirror tests
        env:
          DATABASE_URL: postgresql://orvyn:test-postgres-password@127.0.0.1:5432/orvyn_test
          ORVYN_POSTGRES_MIRROR: "1"
          ORVYN_POSTGRES_SSL: disable
          ORVYN_MODEL_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: node --test apps/backend/dist/persistence/*.test.js

      - name: Distributed Redis tests
        env:
          ORVYN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: node --test apps/backend/dist/queue/*.test.js

      - name: PostgreSQL backup and restore drill
        shell: bash
        env:
          PGPASSWORD: test-postgres-password
        run: |
          set -euo pipefail
          mkdir -p .tmp

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD:/work" \
            postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U orvyn -d orvyn_test -Fc \
            -f /work/.tmp/orvyn_test.dump

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:16-alpine \
            psql -h 127.0.0.1 -U orvyn -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS orvyn_restore" \
            -c "CREATE DATABASE orvyn_restore"

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD:/work" \
            postgres:16-alpine \
            pg_restore -h 127.0.0.1 -U orvyn -d orvyn_restore \
            --no-owner --no-privileges /work/.tmp/orvyn_test.dump

          query_count() {
            local db="$1"
            local table="$2"
            docker run --rm --network host \
              -e PGPASSWORD="$PGPASSWORD" \
              postgres:16-alpine \
              psql -h 127.0.0.1 -U orvyn -d "$db" -Atc \
              "SELECT COUNT(*) FROM $table"
          }

          tables=(
            schema_migrations
            tenants
            missions
            usage_events
            tenant_settings
            tenant_models
            users
            sessions
            legal_acceptances
          )

          for table in "${tables[@]}"; do
            source_count="$(query_count orvyn_test "$table")"
            restore_count="$(query_count orvyn_restore "$table")"
            echo "$table source=$source_count restore=$restore_count"
            test "$source_count" = "$restore_count"
          done

          rm -f .tmp/orvyn_test.dump

      - name: Existing test suite
        env:
          ORVYN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: npm test

      - name: Prepare Compose env file
        run: cp .env.example .env

      - name: Validate Compose
        env:
          ORVYN_API_KEY: test
          DOMAIN: example.invalid
          POSTGRES_PASSWORD: test-postgres-password
          ORVYN_MODEL_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ORVYN_REDIS_PASSWORD: test-orvyn-redis
          LITELLM_REDIS_PASSWORD: test-litellm-redis
          LITELLM_MASTER_KEY: sk-test-master
          LITELLM_SALT_KEY: test-salt
        run: docker compose config >/dev/null
