name: ORVYN Desktop release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [stable, beta, canary]
        default: stable
      publish:
        description: Upload to update storage (requires secrets)
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: orvyn-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Channel and version
        id: meta
        env:
          ORVYN_RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          CHANNEL="${ORVYN_RELEASE_CHANNEL}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              *-canary*) CHANNEL=canary ;;
              *-beta*) CHANNEL=beta ;;
              *) CHANNEL=stable ;;
            esac
            # Tags must be created from a protected release line, not an arbitrary branch commit
            # without review. Refuse unknown prerelease labels on stable.
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "environment=desktop-release-$CHANNEL" >> "$GITHUB_OUTPUT"
          ORVYN_RELEASE_CHANNEL="$CHANNEL" node scripts/check-desktop-version.mjs
      - run: npm run build
      - run: npm test

  windows:
    name: Windows NSIS
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 75
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package Windows
        env:
          GITHUB_SHA: ${{ github.sha }}
          ORVYN_BUILD_SHA: ${{ github.sha }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -w @orvyn/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: orvyn-desktop-windows-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS zip/dmg
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 90
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @orvyn/ai-core && npm run build -w @orvyn/desktop && npm run build -w @orvyn/backend
      - run: node scripts/stage-desktop-backend.mjs
      - name: Package macOS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: orvyn-desktop-macos-${{ github.sha }}
          path: |
            apps/desktop/release/*.{dmg,zip,yml,blockmap}
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux AppImage
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @orvyn/ai-core && npm run build -w @orvyn/desktop && npm run build -w @orvyn/backend
      - run: node scripts/stage-desktop-backend.mjs
      - name: Package Linux
        run: npx electron-builder --linux AppImage --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: orvyn-desktop-linux-${{ github.sha }}
          path: |
            apps/desktop/release/*.{AppImage,yml}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish update feed
    needs: [validate, windows, macos, linux]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 secrets are not configured; skipping production publish."
            exit 0
          fi
          python - <<'PY'
          import os
          for k in ("AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","AWS_ENDPOINT_URL"):
            v = os.environ.get(k,"")
            if v:
              print(k, "is set")
            else:
              print(k, "is empty")
          PY
          prefix="s3://${R2_BUCKET}/orvyn/${CHANNEL}/"
          aws s3 sync artifacts "$prefix" --endpoint-url "$AWS_ENDPOINT_URL" --only-show-errors
