name: Production-compatible PostgreSQL mirror
on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "infrastructure/ovh/compose.control-plane.yml"
      - "infrastructure/ovh/restore-drill.sh"
      - "infrastructure/ovh/backup-data.mjs"
      - "scripts/acceptance/restore-drill-ci.sh"
      - ".env.example"
      - "package.json"
      - ".github/workflows/postgres-production-mirror.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orvyn
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: production_compatibility_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orvyn -d production_compatibility_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install existing production dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build production workspaces
        run: npm run build
      - name: Existing production regression suite with mirror off
        run: npm test
      - name: Existing worker sandbox regression tests
        run: node --test apps/worker/dist/sandbox/*.test.js
      - name: Worker admission cancellation and retry regressions
        run: node --test apps/backend/dist/routes/workerAdmission.test.js
      - name: Exact billing and Stripe regression gate
        run: node scripts/acceptance/billing-e2e.mjs
      - name: Authentication, onboarding, admin and WebSocket acceptance
        run: node scripts/acceptance/admin-api.mjs
      - name: Compatible mirror, identity coexistence, vault and outage tests
        env:
          ORVYN_POSTGRES_MIRROR: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test --test-concurrency=1 apps/backend/dist/persistence/TenantPostgresMirror.test.js
      - name: Complete authentication migration and restored security behavior
        env:
          ORVYN_AUTH_STORAGE_TEST: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test apps/backend/dist/identity/PostgresAuthStorage.test.js
      - name: PostgreSQL authentication runtime concurrency and security
        env:
          ORVYN_AUTH_RUNTIME_TEST: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test apps/backend/dist/identity/PostgresAuthRuntime.test.js
      - name: Shared PostgreSQL staff and onboarding transactions
        env:
          ORVYN_AUTH_RUNTIME_TEST: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test apps/backend/dist/identity/PostgresSharedAccountStores.test.js
      - name: Complete credit ledger migration and restored balances
        env:
          ORVYN_LEDGER_STORAGE_TEST: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test apps/backend/dist/billing/PostgresLedgerStorage.test.js
      - name: Complete Stripe payment migration and restored webhook behavior
        env:
          ORVYN_STRIPE_STORAGE_TEST: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test apps/backend/dist/billing/PostgresStripeStorage.test.js
      - name: PostgreSQL payment runtime and shared billing transactions
        env:
          ORVYN_PAYMENT_RUNTIME_TEST: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test apps/backend/dist/billing/PostgresPaymentRuntime.test.js
      - name: PostgreSQL ledger runtime parity and full financial transactions
        env:
          ORVYN_LEDGER_RUNTIME_TEST: "1"
          ORVYN_PG_URL: postgresql://orvyn:test-password@127.0.0.1:5432/production_compatibility_test
        run: node --test apps/backend/dist/billing/PostgresLedgerRuntime.test.js
      - name: Backup and restore tenant mirror alongside identity schema
        env:
          PGPASSWORD: test-password
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          pgclient() { docker run --rm --network host -e PGPASSWORD -v "$PWD/.tmp:/backup" postgres:16-alpine "$@"; }
          pgclient pg_dump -h 127.0.0.1 -U orvyn -d production_compatibility_test -Fc -f /backup/mirror.dump
          pgclient psql -h 127.0.0.1 -U orvyn -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mirror_restore'
          pgclient pg_restore -h 127.0.0.1 -U orvyn -d mirror_restore --no-owner --no-privileges /backup/mirror.dump
          tables=(orvyn_storage.migrations orvyn_storage.missions orvyn_storage.usage_events orvyn_storage.settings orvyn_storage.models public.identity_migrations public.identity_users public.identity_organizations public.identity_organization_members public.identity_sessions public.identity_projects public.identity_chats)
          tables+=(orvyn_auth.migrations orvyn_auth.imports orvyn_auth.api_keys orvyn_auth.chat_shares orvyn_auth.desktop_handoffs orvyn_auth.email_verifications orvyn_auth.github_links orvyn_auth.legal_acceptances orvyn_auth.login_failures orvyn_auth.oauth_identities orvyn_auth.oauth_states orvyn_auth.org_invites orvyn_auth.organization_members orvyn_auth.organizations orvyn_auth.password_resets orvyn_auth.session_rotations orvyn_auth.sessions orvyn_auth.tenant_chats orvyn_auth.tenant_projects orvyn_auth.users)
          tables+=(orvyn_auth.source_sequences orvyn_auth.account_suspensions orvyn_auth.admin_audit orvyn_auth.analytics_events orvyn_auth.onboarding_profiles orvyn_auth.org_profiles orvyn_auth.platform_staff orvyn_auth.support_notes orvyn_auth.view_as_sessions)
          tables+=(orvyn_billing.migrations orvyn_billing.imports orvyn_billing.source_sequences orvyn_billing.auto_recharge orvyn_billing.auto_recharge_requests orvyn_billing.image_rate_cards orvyn_billing.image_reservations orvyn_billing.image_usage_counts orvyn_billing.ledger_entries orvyn_billing.rate_cards orvyn_billing.run_budget orvyn_billing.usage_events orvyn_billing.wallets)
          tables+=(orvyn_payments.migrations orvyn_payments.imports orvyn_payments.stripe_customers orvyn_payments.stripe_events orvyn_payments.stripe_checkouts orvyn_payments.stripe_subscriptions)
          tables+=(orvyn_recovery.billing_outbox orvyn_recovery.release_outbox)
          for table in "${tables[@]}"; do
            query="SELECT md5(COALESCE(string_agg(row_to_json(t)::text, E'\\n' ORDER BY row_to_json(t)::text), '')) FROM $table t"
            original=$(pgclient psql -h 127.0.0.1 -U orvyn -d production_compatibility_test -Atc "$query")
            restored=$(pgclient psql -h 127.0.0.1 -U orvyn -d mirror_restore -Atc "$query")
            test "$original" = "$restored"
            printf '%s restored content matches\n' "$table"
          done
          query="SELECT last_value::text || ':' || is_called::text FROM orvyn_auth.admin_audit_seq_seq"
          original=$(pgclient psql -h 127.0.0.1 -U orvyn -d production_compatibility_test -Atc "$query")
          restored=$(pgclient psql -h 127.0.0.1 -U orvyn -d mirror_restore -Atc "$query")
          test "$original" = "$restored"
          printf 'Restored audit sequence matches\n'
          query="SELECT last_value::text || ':' || is_called::text FROM orvyn_billing.ledger_entries_seq_seq"
          original=$(pgclient psql -h 127.0.0.1 -U orvyn -d production_compatibility_test -Atc "$query")
          restored=$(pgclient psql -h 127.0.0.1 -U orvyn -d mirror_restore -Atc "$query")
          test "$original" = "$restored"
          printf 'Restored ledger sequence matches\n'
      - name: Compose validation with existing production overlays
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f infrastructure/ovh/compose.prod.yml -f infrastructure/ovh/compose.control-plane.yml -f infrastructure/ovh/compose.worker.yml config --quiet
      - name: Build the actual production backend image
        run: docker build -f apps/backend/Dockerfile -t orvyn-production-mirror:${{ github.sha }} .
      - name: Verify compiled mirror integration in the runtime image
        run: >-
          docker run --rm --entrypoint node orvyn-production-mirror:${{ github.sha }}
          -e "const m=require('./dist/persistence/TenantPostgresMirror.js'); m.validateTenantMirrorMode({}); console.log('Compiled mirror module loads with flags off')"
      - name: Restore SQLite backup and boot isolated production backend
        env:
          ORVYN_RESTORE_IMAGE: orvyn-production-mirror:${{ github.sha }}
          ORVYN_RESTORE_RECORD_STATUS: "0"
        run: bash scripts/acceptance/restore-drill-ci.sh
