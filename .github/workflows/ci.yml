name: ORVYN CI

on:
  push:
    branches:
      - main
      - fix/core-agent-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvyn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run test suite
        run: npm test

  windows-installer:
    name: Windows installer artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run dist:win -w @orvyn/desktop

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: orvyn-windows-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
          if-no-files-found: warn
