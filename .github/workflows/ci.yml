name: ORVYN CI

on:
  push:
    branches:
      - main
      - fix/core-agent-runtime
      - codex/production-signup-hf
      - codex/shared-hf-auto
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment:
        description: Release target
        type: choice
        options: [verify, staging, production]
        default: verify

permissions:
  contents: read

concurrency:
  group: orvyn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use minimum supported Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check minimum Node.js runtime
        run: |
          node apps/backend/scripts/check-node-version.cjs
          node --test apps/backend/scripts/check-node-version.test.cjs

      - name: Build all workspaces
        run: npm run build

      - name: Run test suite
        run: |
          set +e
          npm test > test-out.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "not ok |^# (fail|tests|pass|skipped)|AssertionError|ERR_|Error:" test-out.txt | head -60 | while IFS= read -r line; do
              echo "::error title=test-suite::$line"
            done
          fi
          exit "$code"

      - name: Worker sandbox tests (policy templates, provider selection, fallback, reconcile)
        run: node --test apps/worker/dist/sandbox/*.test.js

      - name: Desktop project sandbox acceptance gate
        env:
          ORVYN_REQUIRE_SANDBOX_TEST: "1"
        run: |
          docker pull node:22-slim
          node --test apps/backend/dist/execution/acceptanceMatrix.test.js
          ORVYN_SANDBOX_IMAGE=node:22-slim node scripts/acceptance/worker-sandbox-e2e.mjs

      - name: Signup legal compatibility
        run: |
          npm test -w @orvyn/web
          node --test apps/backend/dist/routes/signupLegal.test.js

      - name: Verify production backend image builds
        if: github.ref == 'refs/heads/codex/production-signup-hf' || github.ref == 'refs/heads/codex/shared-hf-auto'
        run: docker build -f apps/backend/Dockerfile -t orvyn-backend:${{ github.sha }} .

      - name: Verify signup UI in the production image
        if: github.ref == 'refs/heads/codex/production-signup-hf' || github.ref == 'refs/heads/codex/shared-hf-auto'
        run: docker run --rm -i --entrypoint node orvyn-backend:${{ github.sha }} < scripts/acceptance/signup-legal-ui.cjs

  windows-installer:
    name: Windows installer artifact
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Short SHA
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA
          "SHORT_SHA=$($sha.Substring(0,7))" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Packaging desktop SHA $sha"

      - name: Build Windows installer
        env:
          GITHUB_SHA: ${{ github.sha }}
          ORVYN_BUILD_SHA: ${{ github.sha }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -w @orvyn/desktop

      - name: List packaging output
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release"
          if (-not (Test-Path $root)) { throw "electron-builder output directory missing: $root" }
          Get-ChildItem -Recurse $root | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release"
          $expected = Join-Path $root "ORVYN-Setup-$env:SHORT_SHA.exe"
          if (-not (Test-Path -LiteralPath $expected)) { throw "Expected installer missing: $expected" }
          $stale = Join-Path $root "ORVYN Setup 0.1.0.exe"
          if (Test-Path -LiteralPath $stale) { throw "Unversioned installer was still produced: $stale" }
          $files = @(Get-ChildItem -Path $root -Filter *.exe -File -ErrorAction SilentlyContinue)
          foreach ($f in $files) { Write-Host ("FOUND {0} {1} bytes" -f $f.Name, $f.Length) }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: orvyn-windows-${{ env.SHORT_SHA }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged Desktop runtime
        if: github.ref == 'refs/heads/codex/shared-hf-auto'
        uses: actions/upload-artifact@v4
        with:
          name: orvyn-packaged-desktop
          path: apps/desktop/release/win-unpacked/
          retention-days: 7

  deploy-ovh:
    name: Deploy OVH control plane
    needs: [build-and-test, desktop-hosted, fireworks-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: always() && needs.build-and-test.result == 'success' && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/production-signup-hf')) || (github.ref == 'refs/heads/codex/shared-hf-auto' && needs.desktop-hosted.result == 'success' && needs.fireworks-staging.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.deployment == 'production') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-production]')))))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to OVH
        env:
          OVH_HOST: ubuntu@40.160.11.123
          OVH_REMOTE_DIR: /home/ubuntu/orvyn
          OVH_HEALTH_URL: https://orvyn.virphoneusa.com/api/v1/health
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          # Model provider keys: written into the server's .env on deploy (never into the image or git).
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_TOKEN }}
          HUGGINGFACE_BASE_URL: ${{ vars.HUGGINGFACE_BASE_URL }}
          HUGGINGFACE_MODELS: ${{ vars.HUGGINGFACE_MODELS }}
          HUGGINGFACE_ROUTING_ENABLED: ${{ vars.HUGGINGFACE_ROUTING_ENABLED || '0' }}
          # Account email (verification links), sign-in and billing: same path.
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.SMTP_SERVER || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.SMTP_USERNAME || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_FROM_EMAIL || vars.SMTP_FROM }}
          # One combined secret per provider also works (split by scripts/split-oauth-secrets.py).
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          ORVYN_GH_SECRET: ${{ secrets.ORVYN_GH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # GitHub refuses secret names that start with GITHUB_, so these arrive as GH_* (or ORVYN_GITHUB_*).
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID || secrets.GH_OAUTH_CLIENT_ID || secrets.ORVYN_GITHUB_CLIENT_ID || secrets.OAUTH_GITHUB_CLIENT_ID || vars.GH_CLIENT_ID || vars.ORVYN_GH_CLIENT_ID || vars.ORVYN_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET || secrets.GH_OAUTH_CLIENT_SECRET || secrets.ORVYN_GITHUB_CLIENT_SECRET || secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Not secret: Stripe price ids (STRIPE_PRICE_*), ORVYN_PUBLIC_ORIGIN and the
          # off-host backup location (BACKUP_S3_URI, BACKUP_S3_ENDPOINT) are repository
          # variables; deploy-ovh.sh picks only those names out of this JSON.
          DEPLOY_VARS: ${{ toJSON(vars) }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/codex/production-signup-hf" ]; then
            [ -n "$HUGGINGFACE_API_KEY" ] || { echo "::error::Hugging Face secret missing; refusing production promotion."; exit 1; }
            [ "$HUGGINGFACE_ROUTING_ENABLED" = "1" ] || { echo "::error::Set HUGGINGFACE_ROUTING_ENABLED=1 before promotion."; exit 1; }
            live_commit=$(curl -fsS "$OVH_HEALTH_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
            if [ "$live_commit" != "d4748df5a61a40868f49e798031d9a18b8bc3f8c" ] && [ "$live_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Production changed since this targeted promotion was prepared; refusing to overwrite it."
              exit 1
            fi
          fi
          if [ -z "$OVH_SSH_PRIVATE_KEY" ]; then
            # Fail loudly: a green job that deployed nothing hid for days that
            # the server was still running old code.
            echo "::error title=OVH deploy skipped::OVH_SSH_PRIVATE_KEY is not set. Nothing was deployed. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # The runner has no ~/.ssh until something creates it; a key pasted
          # from Windows may carry CR line endings, which ssh rejects.
          mkdir -p -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/ovh_deploy"
          chmod 600 "$HOME/.ssh/ovh_deploy"
          ssh-keygen -y -f "$HOME/.ssh/ovh_deploy" > /dev/null || { echo "::error title=OVH deploy key::OVH_SSH_PRIVATE_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."; exit 1; }
          export OVH_SSH_KEY="$HOME/.ssh/ovh_deploy"
          if [ "$GITHUB_REF" = "refs/heads/codex/shared-hf-auto" ]; then
            [ -n "$HUGGINGFACE_API_KEY" ] && [ "$HUGGINGFACE_ROUTING_ENABLED" = "1" ] || { echo "::error::HF configuration missing"; exit 1; }
            live_commit=$(curl -fsS "$OVH_HEALTH_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
            echo "Production before: $live_commit"
            [ "$live_commit" = "7f5e129c992f02c4133145141d23119dde25eebb" ] || [ "$live_commit" = "$GITHUB_SHA" ] || { echo "::error::Production changed; refusing overwrite"; exit 1; }
            staging_commit=$(curl -fsS https://staging.orvyn.virphoneusa.com/api/v1/health | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
            [ "$staging_commit" = "$GITHUB_SHA" ] || { echo "::error::Staging SHA mismatch"; exit 1; }
            ssh -i "$OVH_SSH_KEY" -o StrictHostKeyChecking=accept-new "$OVH_HOST" 'docker image tag "$(docker inspect orvyn-backend-1 --format "{{.Image}}")" orvyn-backend:rollback-7f5e129'
          fi
          bash scripts/deploy-ovh.sh
          if [ "$GITHUB_REF" = "refs/heads/codex/shared-hf-auto" ]; then
            cat scripts/acceptance/hf-routing-preflight.cjs | ssh -i "$OVH_SSH_KEY" -o StrictHostKeyChecking=accept-new "$OVH_HOST" 'docker exec -i orvyn-backend-1 node'
            curl -fsS "$OVH_HEALTH_URL"; echo
          fi
          shred -u "$HOME/.ssh/ovh_deploy" 2>/dev/null || rm -f "$HOME/.ssh/ovh_deploy"

  deploy-staging:
    name: Verify isolated OVH staging
    needs: [build-and-test, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.ref == 'refs/heads/codex/shared-hf-auto' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deployment != 'verify'))
    steps:
      - uses: actions/checkout@v4
      - name: Deploy candidate to isolated staging
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_TOKEN }}
          HUGGINGFACE_ROUTING_ENABLED: ${{ vars.HUGGINGFACE_ROUTING_ENABLED || '0' }}
          HUGGINGFACE_MODELS: ${{ vars.HUGGINGFACE_MODELS }}
          HUGGINGFACE_BASE_URL: ${{ vars.HUGGINGFACE_BASE_URL }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_MODELS: ${{ vars.FIREWORKS_MODELS }}
          FIREWORKS_BASE_URL: ${{ vars.FIREWORKS_BASE_URL }}
        run: |
          [ -n "$OVH_SSH_PRIVATE_KEY" ] && [ -n "$HUGGINGFACE_API_KEY" ] && [ "$HUGGINGFACE_ROUTING_ENABLED" = "1" ] || { echo "::error::Staging configuration missing"; exit 1; }
          mkdir -p -m 700 "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/ovh_deploy"
          chmod 600 "$HOME/.ssh/ovh_deploy"
          trap 'rm -f "$HOME/.ssh/ovh_deploy"' EXIT
          export OVH_SSH_KEY="$HOME/.ssh/ovh_deploy"
          bash scripts/deploy-ovh-staging.sh

  fireworks-staging:
    name: Verify pinned Fireworks route in staging
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual Fireworks provider without fallback
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/orvyn-fireworks-staging-ssh"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          cat scripts/acceptance/hf-routing-preflight.cjs | ssh -i "$key" -o StrictHostKeyChecking=accept-new ubuntu@40.160.11.123 'docker exec -i backend-staging node - /app/dist fireworks'

  desktop-hosted:
    name: Windows Desktop against staging
    needs: [deploy-staging, windows-installer]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: orvyn-packaged-desktop
          path: apps/desktop/release/win-unpacked/
      - name: Verify hosted Desktop and cleanup isolated account
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          ORVYN_CLOUD_URL: https://staging.orvyn.virphoneusa.com
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'orvyn-fixture-ssh'
          [IO.File]::WriteAllText($keyPath, ($env:OVH_SSH_PRIVATE_KEY -replace "`r", '') + "`n", [Text.UTF8Encoding]::new($false))
          icacls $keyPath /inheritance:r /grant:r "$([Security.Principal.WindowsIdentity]::GetCurrent().Name):(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restrict temporary deployment key permissions' }
          $env:OVH_SSH_KEY = $keyPath
          Remove-Item Env:OVH_SSH_PRIVATE_KEY
          try { node scripts/acceptance/hf-desktop-runtime.mjs; if ($LASTEXITCODE -ne 0) { throw 'Hosted Desktop verification failed' } } finally { Remove-Item -LiteralPath $keyPath -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-staging-evidence
          path: desktop-hf-runtime.png

  desktop-production:
    name: Windows Desktop against production
    needs: [deploy-ovh, windows-installer]
    runs-on: windows-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/codex/shared-hf-auto' && ((github.event_name == 'workflow_dispatch' && inputs.deployment == 'production') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-production]')))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: orvyn-packaged-desktop
          path: apps/desktop/release/win-unpacked/
      - name: Verify actual production provider through packaged Desktop
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          ORVYN_CLOUD_URL: https://orvyn.virphoneusa.com
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'orvyn-fixture-ssh'
          [IO.File]::WriteAllText($keyPath, ($env:OVH_SSH_PRIVATE_KEY -replace "`r", '') + "`n", [Text.UTF8Encoding]::new($false))
          icacls $keyPath /inheritance:r /grant:r "$([Security.Principal.WindowsIdentity]::GetCurrent().Name):(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restrict temporary deployment key permissions' }
          $env:OVH_SSH_KEY = $keyPath
          Remove-Item Env:OVH_SSH_PRIVATE_KEY
          try { node scripts/acceptance/hf-desktop-runtime.mjs; if ($LASTEXITCODE -ne 0) { throw 'Production Desktop verification failed' } } finally { Remove-Item -LiteralPath $keyPath -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-production-evidence
          path: desktop-hf-runtime.png
