name: ORVYN CI

on:
  push:
    branches:
      - main
      - fix/core-agent-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvyn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run test suite
        run: |
          set +e
          npm test > test-out.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "not ok |^# (fail|tests|pass|skipped)|AssertionError|ERR_|Error:" test-out.txt | head -60 | while IFS= read -r line; do
              echo "::error title=test-suite::$line"
            done
          fi
          exit "$code"

  windows-installer:
    name: Windows installer artifact
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Short SHA
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA
          "SHORT_SHA=$($sha.Substring(0,7))" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Packaging desktop SHA $sha"

      - name: Build Windows installer
        env:
          GITHUB_SHA: ${{ github.sha }}
          ORVYN_BUILD_SHA: ${{ github.sha }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -w @orvyn/desktop

      - name: List packaging output
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release"
          if (-not (Test-Path $root)) { throw "electron-builder output directory missing: $root" }
          Get-ChildItem -Recurse $root | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release"
          $expected = Join-Path $root "ORVYN-Setup-$env:SHORT_SHA.exe"
          if (-not (Test-Path -LiteralPath $expected)) { throw "Expected installer missing: $expected" }
          $stale = Join-Path $root "ORVYN Setup 0.1.0.exe"
          if (Test-Path -LiteralPath $stale) { throw "Unversioned installer was still produced: $stale" }
          $files = @(Get-ChildItem -Path $root -Filter *.exe -File -ErrorAction SilentlyContinue)
          foreach ($f in $files) { Write-Host ("FOUND {0} {1} bytes" -f $f.Name, $f.Length) }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: orvyn-windows-${{ env.SHORT_SHA }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  deploy-ovh:
    name: Deploy OVH control plane
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to OVH
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$OVH_SSH_PRIVATE_KEY" ]; then
            # Fail loudly: a green job that deployed nothing hid for days that
            # the server was still running old code.
            echo "::error title=OVH deploy skipped::OVH_SSH_PRIVATE_KEY is not set. Nothing was deployed. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # The runner has no ~/.ssh until something creates it; a key pasted
          # from Windows may carry CR line endings, which ssh rejects.
          mkdir -p -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/ovh_deploy"
          chmod 600 "$HOME/.ssh/ovh_deploy"
          ssh-keygen -y -f "$HOME/.ssh/ovh_deploy" > /dev/null || { echo "::error title=OVH deploy key::OVH_SSH_PRIVATE_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."; exit 1; }
          export OVH_SSH_KEY="$HOME/.ssh/ovh_deploy"
          bash scripts/deploy-ovh.sh
          shred -u "$HOME/.ssh/ovh_deploy" 2>/dev/null || rm -f "$HOME/.ssh/ovh_deploy"
