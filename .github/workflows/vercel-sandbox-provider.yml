name: Vercel Sandbox Provider Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/backend/src/sandbox/**"
      - "apps/backend/src/ai/tools/sandboxTools.ts"
      - "apps/backend/src/agent/MultiAgentRuntime.ts"
      - "apps/backend/package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/vercel-sandbox-provider.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --workspaces --ignore-scripts --no-audit --no-fund

      - name: Build ai-core
        run: npm run build -w @orvyn/ai-core

      - name: Build backend
        run: npm run build -w @orvyn/backend

      - name: Sandbox provider tests
        run: node --test apps/backend/dist/sandbox/*.test.js

      - name: Existing ORVYN tests
        run: npm test
