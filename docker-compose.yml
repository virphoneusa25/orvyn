# docker-compose.yml
# Cloud deployment: backend + optional self-hosted Ollama + Caddy for
# automatic HTTPS via Let's Encrypt. Run on any Linux VM (AWS/Azure/
# DigitalOcean/Vultr/bare metal) with Docker + Docker Compose installed.
#
# Quick start:
#   1. Point a DNS A record at the server (e.g. orvyn.yourdomain.com)
#   2. cp .env.example .env  and fill in ORVYN_API_KEY + DOMAIN
#   3. docker compose up -d
#
# The desktop client then connects to https://orvyn.yourdomain.com
# (see docs/DEPLOYMENT.md for the Windows client side).

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    # Model/provider keys, quotas, etc. all come from .env — the backend reads
    # the same variables in a container as it does on a dev machine.
    env_file:
      - .env
    environment:
      - PORT=4570
      - ORVYN_API_KEY=${ORVYN_API_KEY}
      # SQLite tenant stores (accounts, missions, usage/billing records) must
      # outlive image rebuilds — losing usage events loses money.
      - ORVYN_DATA_DIR=/data
    volumes:
      - orvyn-data:/data
      # Sandbox execution: the backend spawns per-mission containers as
      # SIBLINGS on the host daemon (not nested inside itself). The socket
      # mount is the minimum required for that; the sandbox containers it
      # spawns run with --network none, --cap-drop ALL and resource ceilings.
      - /var/run/docker.sock:/var/run/docker.sock
      # Cloud mission workspaces (repos cloned for cloud jobs land here).
      - orvyn-projects:/projects
    expose:
      - "4570"
    # Uncomment to persist future Postgres-backed state (Phase 7):
    # depends_on: [postgres]

  # Optional: self-hosted model server. Comment this whole block out if
  # you're pointing ORVYN at a different GPU box or a custom model API
  # instead — the backend doesn't care where models live.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    # Requires the NVIDIA container runtime on the host for GPU access:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Terminates TLS and reverse-proxies to the backend. Caddy fetches and
  # renews Let's Encrypt certificates automatically from DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
      - STAGING_DOMAIN=${STAGING_DOMAIN:-staging.orvyn.virphoneusa.com}
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  orvyn-data:
  orvyn-projects:
  ollama-data:
  caddy-data:
  caddy-config:
