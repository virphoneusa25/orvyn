# docker-compose.yml
# Cloud deployment: ORVYN backend + dedicated Redis services + LiteLLM +
# optional Ollama + Caddy TLS.
#
# Redis is deliberately split by responsibility:
#   orvyn-redis   -> mission queue/state/events (BullMQ + Redis Streams)
#   litellm-redis -> LiteLLM coordination/cooldowns/cache metadata
#
# Quick start:
#   1. Point a DNS A record at the server (e.g. orvyn.yourdomain.com)
#   2. cp .env.example .env and fill in required secrets
#   3. docker compose up -d
#
# IMPORTANT:
# - Redis is never published to the host.
# - LiteLLM is internal-only; the ORVYN backend reaches it over the Compose network.
# - BullMQ requires Redis maxmemory-policy=noeviction.

services:
  orvyn-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${ORVYN_REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction"
      ]
    volumes:
      - orvyn-redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${ORVYN_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - ORVYN_REDIS_PASSWORD=${ORVYN_REDIS_PASSWORD}

  litellm-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${LITELLM_REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction"
      ]
    volumes:
      - litellm-redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${LITELLM_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - LITELLM_REDIS_PASSWORD=${LITELLM_REDIS_PASSWORD}

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    expose:
      - "4000"
    volumes:
      - ./infrastructure/litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - REDIS_HOST=litellm-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${LITELLM_REDIS_PASSWORD}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      litellm-redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=4570
      - ORVYN_API_KEY=${ORVYN_API_KEY}
      - ORVYN_DATA_DIR=/data

      # Dedicated mission/event Redis. The existing in-process MissionQueue is
      # still active until the BullMQ migration phase lands; these variables
      # establish the production connection contract now.
      - ORVYN_REDIS_URL=redis://:${ORVYN_REDIS_PASSWORD}@orvyn-redis:6379/0

      # Internal LiteLLM endpoint. ModelGateway migration is feature-gated and
      # will switch to this URL in a later phase without changing ORION roles.
      - MODEL_ROUTER_URL=http://litellm:4000/v1
      - MODEL_ROUTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - orvyn-data:/data
      # TEMPORARY: backend still owns sandbox execution today.
      # This mount moves to the dedicated mission worker in the BullMQ phase.
      - /var/run/docker.sock:/var/run/docker.sock
      - orvyn-projects:/projects
    expose:
      - "4570"
    depends_on:
      orvyn-redis:
        condition: service_healthy
      litellm:
        condition: service_started

  # Distributed mission worker. Opt-in until the Redis control channel
  # (approve/steer/cancel) is enabled. Scale with:
  #   docker compose --profile distributed up -d --scale orvyn-worker=5
  orvyn-worker:
    profiles: ["distributed"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["node", "dist/workers/missionWorker.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ORVYN_REDIS_URL=redis://:${ORVYN_REDIS_PASSWORD}@orvyn-redis:6379/0
      - ORVYN_DISTRIBUTED_MISSIONS=${ORVYN_DISTRIBUTED_MISSIONS:-0}
      - ORVYN_DISTRIBUTED_CONTROLS=${ORVYN_DISTRIBUTED_CONTROLS:-0}
      - ORVYN_WORKER_CONCURRENCY=${ORVYN_WORKER_CONCURRENCY:-1}
      - ORVYN_MISSION_EXECUTION=sandbox
      - MODEL_ROUTER_URL=http://litellm:4000/v1
      - MODEL_ROUTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      # Only workers will retain this mount after distributed cutover.
      - /var/run/docker.sock:/var/run/docker.sock
      - orvyn-projects:/projects
      - orvyn-data:/data
    depends_on:
      orvyn-redis:
        condition: service_healthy
      litellm:
        condition: service_started

  # Optional self-hosted model server. Comment out when unused.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  orvyn-data:
  orvyn-projects:
  orvyn-redis-data:
  litellm-redis-data:
  ollama-data:
  caddy-data:
  caddy-config:
